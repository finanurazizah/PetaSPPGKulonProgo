    <script>
        function mulaiPanduan() {
            let intro = introJs();
            intro.setOptions({
                nextLabel: 'Lanjut',
                prevLabel: 'Kembali',
                doneLabel: 'Selesai',
                skipLabel: 'Lewati',
                showProgress: false,
                showBullets: true,
                exitOnOverlayClick: false,
                scrollToElement: true,
                tooltipPosition: 'right'
            });
            intro.start();
        }
        window.onload = function () {
            // Tombol zoom
            let zoom = document.querySelector('.ol-zoom');
            if (zoom) {
                zoom.setAttribute(
                    'data-intro',
                    'Gunakan tombol ini untuk memperbesar atau memperkecil peta.'
                );
                zoom.setAttribute('data-step', '1');
            }

            // Layer switcher
            let layer = document.querySelector('.layer-switcher');
            if (layer) {
                layer.setAttribute(
                    'data-intro',
                    'Klik <b>OFF</b> untuk menyembunyikan seluruh layer, <b>ON</b> untuk menampilkan seluruh layer, dan <b>ikon berwarna biru</b> untuk menampilkan layer tertentu.'
                );
                layer.setAttribute('data-step', '2');
            }
            // Legenda
            let legenda = document.getElementById('legend');
            if (legenda) {
                legenda.setAttribute(
                    'data-intro',
                    'Bagian ini merupakan legenda peta.'
                );
                legenda.setAttribute('data-step', '3');
            }
            // Search
            let search = document.querySelector('.search-layer-input-search');
            if (search) {
                search.setAttribute(
                    'data-intro',
                    'Gunakan fitur pencarian untuk mencari SPPG atau sekolah. <br>Tekan <b>Enter</b> setelah mengetik nama SPPG atau sekolah.'
                );
                search.setAttribute('data-step', '4');
            }

            // Map utama
            let mapGuide = document.getElementById('mapGuideCenter');
            if (mapGuide) {
                mapGuide.setAttribute(
                    'data-intro',
                    'Klik titik SPPG atau sekolah pada peta untuk menampilkan informasi atribut.'
                );
                mapGuide.setAttribute('data-step', '5');
            }
        };
    </script>
